<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>研究3</title>
  <style>
    body { margin: 0; overflow: hidden; font: 13px/1.6 "Microsoft YaHei", sans-serif; }
    #panel {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0, 0, 0, 0.72); color: #fff;
      padding: 12px 16px; border-radius: 8px; width: 300px;
    }
    #panel h3 { margin: 0 0 8px; font-size: 15px; color: #4fc3f7; }
    #panel .row { margin: 8px 0; }
    button {
      background: #263238; color: #fff; border: 1px solid #546e7a;
      padding: 4px 10px; margin: 2px; border-radius: 4px; cursor: pointer;
    }
    button.active { background: #0277bd; border-color: #4fc3f7; }
    #fps { font-size: 26px; font-weight: bold; color: #69f0ae; margin: 4px 0; }
    #cfg { color: #ffd54f; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
    th, td { border: 1px solid #546e7a; padding: 3px 6px; text-align: center; }
    th { background: #263238; }
    #tip { color: #b0bec5; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="panel">
    <h3>研究3</h3>
    <div class="row">
      抗锯齿 antialias：
      <button id="aaOn" class="active">开启</button>
      <button id="aaOff">关闭</button>
    </div>
    <div class="row">
      物体数量：
      <button class="cnt" data-n="100">100</button>
      <button class="cnt active" data-n="1000">1000</button>
      <button class="cnt" data-n="5000">5000</button>
    </div>
    <div id="fps">-- FPS</div>
    <div id="cfg">当前：抗锯齿开 / 1000个物体</div>
    <div class="row">
      <button id="record">记录当前读数</button>
      <button id="clear">清空</button>
    </div>
    <table id="logTable">
      <tr><th>#</th><th>抗锯齿</th><th>物体数</th><th>FPS</th></tr>
    </table>
  </div>

  <script src="libs/three.min.js"></script>
  <script src="research.js"></script>
</body>
</html>
